name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        # choco installs it, but doesn't make later steps in this job see it
        # on PATH (each step gets a fresh shell) — GITHUB_PATH is the
        # mechanism for persisting a PATH addition across steps.
        shell: pwsh
        run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build app + installer
        run: wails build --nsis

      - name: Rename release assets to their fixed names
        shell: pwsh
        run: |
          Copy-Item build/bin/Koalmine.exe build/bin/koalmine-windows-amd64.exe
          Copy-Item build/bin/koalmine-amd64-installer.exe build/bin/koalmine-windows-amd64-installer.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/koalmine-windows-amd64.exe
            build/bin/koalmine-windows-amd64-installer.exe
